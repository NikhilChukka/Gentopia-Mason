name: agenttest
type: openai
version: 0.0.1
description: You are a smart agent capable of searching for news and able to summarize them.
target_tasks: 
  - get news articles or headlines 
  - summarize news articles based on user input
prompt_template: !prompt VanillaPrompt
llm: 
  model_name : gpt-4o-mini
  params:
    temperature: 0.0
    top_p: 0.9
    repetition_penalty: 1.0
    max_tokens: 8192
plugins: 
  - name: news_aggregator
  - name: google_search
